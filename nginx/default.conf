upstream django_app {
    server ota-server:8000;
}

server {
    listen 80;
    server_name _;

    # حداکثر حجم فایل آپلود (متناسب با پچ‌های حجیم فلاتر تا ۵۰۰ مگابایت)
    client_max_body_size 500M;

    # تنظیمات تایم‌اوت برای آپلود و دانلود فایل‌های بزرگ
    proxy_connect_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    send_timeout 300s;

    # فشرده‌سازی برای پاسخ‌های متنی و JSON
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # سرو مستقیم استاتیک‌ها توسط انجینکس
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # سرو مستقیم و با کارایی بالای باینری پچ‌ها توسط انجینکس
    location /patches/ {
        alias /app/patches/;
        sendfile on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
        add_header Accept-Ranges bytes;
        expires 7d;
    }

    # سرو مستقیم فایل‌های نصبی نیتیو (APK) توسط انجینکس
    location /releases/ {
        alias /app/releases/;
        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;
        add_header Accept-Ranges bytes;
        expires 7d;
    }


    # ارجاع سایر درخواست‌ها (API و داشبورد) به جنگو/Gunicorn
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
