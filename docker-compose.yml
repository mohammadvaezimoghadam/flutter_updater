services:
  db:
    image: postgres:16-alpine
    container_name: flutter_ota_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flutter_ota_db}
      POSTGRES_USER: ${POSTGRES_USER:-ota_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ota_secret_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ota_user} -d $${POSTGRES_DB:-flutter_ota_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ota-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flutter_ota_server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn ota_hub.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 300"
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-&d+ak@ad-he!a80837mw!vzp0wi615w%jrsppl*#0cz&af8-3d}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - PORT=8000
      - DB_ENGINE=django.db.backends.postgresql
      - POSTGRES_DB=${POSTGRES_DB:-flutter_ota_db}
      - POSTGRES_USER=${POSTGRES_USER:-ota_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ota_secret_123}
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      # ذخیره‌سازی فایل‌های پچ، نسخه‌های نصبی نیتیو و استاتیک‌ها
      - ./patches:/app/patches
      - ./releases:/app/releases
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: flutter_ota_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - ./patches:/app/patches:ro
      - ./releases:/app/releases:ro

    depends_on:
      - ota-server

volumes:
  postgres_data:
  static_volume:
